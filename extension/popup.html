<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabsed</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="3" ry="3"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
        <span class="brand-title">Tabsed</span>
      </div>
      <div id="status-badge" class="badge badge-connected" title="Desktop bridge active">
        Connected
      </div>
    </header>

    <div class="tab-summary">
      <div class="summary-label">Current Window:</div>
      <div id="tab-count" class="summary-count">Analyzing tabs...</div>
    </div>

    <div class="form-group">
      <label for="collection-select">Target Collection:</label>
      <select id="collection-select">
        <option value="inbox">Inbox</option>
        <option value="research">Research</option>
        <option value="development">Development</option>
        <option value="reading">Reading List</option>
      </select>
    </div>

    <div class="options-group">
      <label class="checkbox-label">
        <input type="checkbox" id="capture-thumbnails" checked>
        <span>Capture thumbnails (where permitted)</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="exclude-pinned" checked>
        <span>Exclude pinned tabs</span>
      </label>
    </div>

    <div class="actions">
      <button id="save-current-tab" class="btn btn-secondary">
        Save Active Tab
      </button>
      <button id="save-window" class="btn btn-primary">
        Save Current Window
      </button>
      <button id="save-and-close-window" class="btn btn-danger">
        Save &amp; Close Window
      </button>
    </div>

    <div id="result-message" class="result-message hidden"></div>

    <footer class="footer">
      <a href="#" id="open-desktop" class="footer-link">Open Tabsed Desktop App</a>
      <span class="version">v1.0.0</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
